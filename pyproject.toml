[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecat-electrochemistry"
dynamic = ["version"]
description = "electroChemical Analysis Tools for electrochemical data handling and analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Luke Elissiry" },
]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = [
    "ipython",
    "jinja2",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "scikit-learn",
    "scipy",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Homepage = "https://github.com/ljelissiry/eCAT"
Documentation = "https://github.com/ljelissiry/eCAT/tree/master/docs"
Repository = "https://github.com/ljelissiry/eCAT.git"
Issues = "https://github.com/ljelissiry/eCAT/issues"

[project.optional-dependencies]
app = [
    "dash",
    "dash-ag-grid",
    "pywebview",
]
simulation = [
    "electrokitty",
]
simulation-all = [
    "electrokitty",
]
all = [
    "dash",
    "dash-ag-grid",
    "pywebview",
    "electrokitty",
]
dev = [
    "build",
    "nbclient",
    "nbformat",
    "pytest",
    "pytest-cov",
    "ruff>=0.9",
    "twine",
]

[project.scripts]
ecat-app = "ecat_app.app:main"

[tool.setuptools.packages.find]
where = ["src", "apps/workbench/src"]

[tool.setuptools.dynamic]
version = { attr = "ecat._version.__version__" }

[tool.setuptools.package-data]
ecat = ["defaults.toml"]
ecat_app = ["assets/*.css", "assets/*.svg", "assets/*.js"]

[tool.setuptools.data-files]
"examples/data/fe_phoh_cv" = [
    "examples/data/fe_phoh_cv/*.txt",
    "examples/data/fe_phoh_cv/README.md",
]
"examples/data/chrono_ca" = [
    "examples/data/chrono_ca/*.txt",
    "examples/data/chrono_ca/README.md",
]
"examples/data/chrono_cp" = [
    "examples/data/chrono_cp/*.txt",
    "examples/data/chrono_cp/README.md",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    ".compat-venvs",
    ".venv",
    "build",
    "dist",
    "tmp_docx_render*",
]

[tool.ruff.lint]
# This initial blocking profile contains only high-confidence correctness rules.
# The broader advisory scan is visible in CI while existing debt is reduced.
select = [
    "B006",
    "E9",
    "F601",
    "F63",
    "F7",
    "F811",
    "F82",
    "RUF034",
]
