[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecat"
dynamic = ["version"]
description = "electroChemical Analysis Tools for electrochemical data handling and analysis."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Luke Elissiry" },
]
license = { file = "LICENSE" }
dependencies = [
    "ipython",
    "jinja2",
    "matplotlib",
    "numpy",
    "openpyxl",
    "pandas",
    "scikit-learn",
    "scipy",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
]

[project.optional-dependencies]
app = [
    "dash",
    "dash-ag-grid",
    "pywebview",
]
simulation = [
    "electrokitty",
]
simulation-all = [
    "electrokitty",
]
all = [
    "dash",
    "dash-ag-grid",
    "pywebview",
    "electrokitty",
]

[project.scripts]
ecat-app = "ecat_app.app:main"

[tool.setuptools.packages.find]
where = ["src", "apps/workbench/src"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.dynamic]
version = { attr = "ecat._version.__version__" }

[tool.setuptools.package-data]
ecat = ["defaults.toml"]
ecat_app = ["assets/*.css", "assets/*.svg", "assets/*.js"]
